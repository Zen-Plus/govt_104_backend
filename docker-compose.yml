name: crm104


services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: crm104-backend:latest
    container_name: crm104-backend
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL:?set DB_URL in .env}
      DB_USER: ${DB_USER:?set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}


      MONGO_URI: ${MONGO_URI:?set MONGO_URI in .env}


      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CRYPTO_KEY: ${CRYPTO_KEY:?set CRYPTO_KEY in .env}


      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      SEED_USERS: ${SEED_USERS:-false}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75}


    ports:
"127.0.0.1:${BACKEND_PORT:-8081}:8080"
    networks:
app-db-network
  frontend:
    build:
      context: ../104_frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-}


    image: crm104-frontend:latest
    container_name: crm104-frontend
    restart: unless-stopped


    environment:
      BACKEND_URL: http://backend:8080


    ports:
"${FRONTEND_PORT:-80}:80"
    networks:
app-db-network
networks:
  app-db-network:
    external: true
    name: app-db-network